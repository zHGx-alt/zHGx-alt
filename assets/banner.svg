<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="adrian@paneda: $ whoami, networks, systems and data engineering">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 700px 100px; }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
  </style>
  <rect width="880" height="200" rx="14" fill="#0D1117"/>
  <rect x=".5" y=".5" width="879" height="199" rx="13.5" fill="none" stroke="#21262D"/>
  <circle cx="26" cy="24" r="5" fill="#30363D"/><circle cx="44" cy="24" r="5" fill="#30363D"/><circle cx="62" cy="24" r="5" fill="#30363D"/>
  <text x="40" y="76" class="mono" font-size="16" fill="#5EE6C8">$ whoami</text>
  <text x="40" y="122" class="sans" font-size="40" font-weight="700" fill="#E6EDF3">Adrián Pañeda</text>
  <text x="40" y="158" class="mono" font-size="16" fill="#9DA7B3">networks · systems · data engineering<tspan class="cursor" fill="#5EE6C8"> ▍</tspan></text>
  <g class="pulse">
    <g stroke="#30363D" stroke-width="1.5">
      <line x1="700" y1="100" x2="640" y2="52"/><line x1="700" y1="100" x2="770" y2="56"/>
      <line x1="700" y1="100" x2="634" y2="148"/><line x1="700" y1="100" x2="766" y2="150"/>
      <line x1="640" y1="52" x2="770" y2="56"/><line x1="770" y1="56" x2="812" y2="104"/><line x1="766" y1="150" x2="812" y2="104"/>
    </g>
    <g stroke="#5EE6C8" stroke-width="2"><line x1="640" y1="52" x2="700" y2="100"/><line x1="700" y1="100" x2="766" y2="150"/></g>
    <circle cx="700" cy="100" r="11" fill="#0D1117" stroke="#5EE6C8" stroke-width="2"/>
    <circle cx="640" cy="52" r="6" fill="#5EE6C8"/><circle cx="766" cy="150" r="6" fill="#5EE6C8"/>
    <circle cx="770" cy="56" r="6" fill="#30363D"/><circle cx="634" cy="148" r="6" fill="#30363D"/><circle cx="812" cy="104" r="5" fill="#30363D"/>
